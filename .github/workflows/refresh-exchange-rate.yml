name: Refresh EUR/USD fallback

on:
  schedule:
    - cron: "43 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-rate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch and validate ECB reference rate
        run: npm run refresh:fx

      - name: Validate all data
        run: |
          npm test
          npm run validate:data
          npm run validate:fx

      - name: Enforce fallback-only change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "The checked-in fallback already matches the latest observation."
            exit 0
          fi
          if [[ "$changed" != "data/exchange-rates.v1.json" ]]; then
            echo "Unexpected changed path(s):"
            echo "$changed"
            exit 1
          fi

      - name: Commit refreshed fallback
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exchange-rates.v1.json
          git commit -m "Refresh EUR/USD fallback rate"
          git push
