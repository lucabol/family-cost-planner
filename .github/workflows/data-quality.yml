name: Validate cost data

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - data/**
      - schema/**
      - scripts/**
      - tests/**
      - app.js
      - fx.js
      - index.html
      - styles.css
      - package.json
      - package-lock.json
      - .github/workflows/data-quality.yml
      - .github/workflows/refresh-exchange-rate.yml
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run schema and semantic tests
        run: npm test

      - name: Validate checked-in data
        run: |
          npm run validate:data
          npm run validate:fx

      - name: Flag cost-data weekly-change thresholds on pull requests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/costs.v1.baseline.json"
          git show "origin/${BASE_REF}:data/costs.v1.json" > "$baseline"
          node scripts/validate-data.mjs data/costs.v1.json --baseline "$baseline"

      - name: Flag exchange-rate weekly-change thresholds on pull requests
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          fx_baseline="${RUNNER_TEMP}/exchange-rates.v1.baseline.json"
          if git cat-file -e "origin/${BASE_REF}:data/exchange-rates.v1.json" 2>/dev/null; then
            git show "origin/${BASE_REF}:data/exchange-rates.v1.json" > "$fx_baseline"
            node scripts/validate-exchange-rate.mjs data/exchange-rates.v1.json --baseline "$fx_baseline"
          fi
